<!DOCTYPE html>
<html>

<head>

    <title>Smart Medical Waste Management - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e1f5ef,
                    #ffffff
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-container {

            width: 90%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.15);

            text-align: center;
        }


        .logo {

            font-size: 60px;

            margin-bottom: 10px;
        }


        h1 {

            color: #176b5b;

            font-size: 27px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }


        label {

            display: block;

            text-align: left;

            font-weight: bold;

            margin-top: 18px;
        }


        input,
        select {

            width: 100%;

            padding: 13px;

            margin-top: 7px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #176b5b;
        }


        .login-btn {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            background: #176b5b;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #0d4d42;
        }


        .message {

            margin-top: 15px;

            font-weight: bold;

            color: #c0392b;
        }


        .footer {

            margin-top: 25px;

            font-size: 13px;

            color: #777;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🏥
    </div>


    <h1>
        SMART MEDICAL WASTE
    </h1>


    <p class="subtitle">
        Management System
    </p>



    <!-- ROLE -->

    <label>
        Login As
    </label>


    <select id="role">

        <option value="hospital">
            Hospital Staff
        </option>

        <option value="collector">
            Waste Collector
        </option>

        <option value="admin">
            Administrator
        </option>

    </select>



    <!-- USERNAME -->

    <label>
        Username
    </label>


    <input
        type="text"
        id="username"
        placeholder="Enter username"
    >



    <!-- PASSWORD -->

    <label>
        Password
    </label>


    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >



    <!-- LOGIN -->

    <button
        class="login-btn"
        onclick="login()">

        🔐 Login

    </button>



    <div
        id="message"
        class="message">
    </div>



    <div class="footer">

        Smart Medical Waste Management System

    </div>


</div>



<script>


function login() {


    let role =
        document.getElementById(
            "role"
        ).value;


    let username =
        document.getElementById(
            "username"
        ).value.trim();


    let password =
        document.getElementById(
            "password"
        ).value;



    // Check empty fields

    if (
        username === "" ||
        password === ""
    ) {

        document.getElementById(
            "message"
        ).innerText =
            "Please enter username and password.";

        return;

    }



    // Save login role

    localStorage.setItem(
        "userRole",
        role
    );



    localStorage.setItem(
        "loggedIn",
        "true"
    );



    // Hospital

    if (
        role === "hospital"
    ) {

        window.location.href =
            "hospital.html";

    }



    // Collector

    else if (
        role === "collector"
    ) {

        window.location.href =
            "collector.html";

    }



    // Admin

    else if (
        role === "admin"
    ) {

        window.location.href =
            "admin.html";

    }

}


</script>


</body>

</html>
