<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Smart Medical Waste</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f6;
            color: #222;
        }

        header {
            background: #176b5b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        h2 {
            color: #176b5b;
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #176b5b;
            margin-top: 8px;
        }

        .info-row {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .status {
            padding: 12px;
            margin-top: 15px;
            border-radius: 7px;
            background: #fff3cd;
            font-weight: bold;
        }

        .no-request {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            color: white;
            background: #176b5b;
            font-size: 15px;
            cursor: pointer;
        }

        .refresh-button {
            background: #2868a6;
        }

        .logout-button {
            background: #c0392b;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📊 SMART MEDICAL WASTE</h1>
    <p>Admin Dashboard</p>
</header>


<div class="container">

    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <div>Total Requests</div>
            <div class="stat-number" id="totalRequests">0</div>
        </div>

        <div class="stat-card">
            <div>Pending</div>
            <div class="stat-number" id="pendingRequests">0</div>
        </div>

        <div class="stat-card">
            <div>Completed</div>
            <div class="stat-number" id="completedRequests">0</div>
        </div>

    </div>


    <!-- CURRENT REQUEST -->

    <div class="card">

        <h2>📋 Current Collection Request</h2>

        <div id="noRequest" class="no-request">
            No active collection request.
        </div>


        <div id="requestDetails" style="display:none;">

            <div class="info-row">
                <b>Request ID:</b>
                <span id="requestId">-</span>
            </div>

            <div class="info-row">
                <b>Hospital:</b>
                <span id="hospital">-</span>
            </div>

            <div class="info-row">
                <b>Waste Type:</b>
                <span id="waste">-</span>
            </div>

            <div class="info-row">
                <b>Quantity:</b>
                <span id="quantity">-</span>
            </div>

            <div class="info-row">
                <b>Collection Location:</b>
                <span id="location">-</span>
            </div>

            <div class="info-row">
                <b>AI Category:</b>
                <span id="aiCategory">-</span>
            </div>

            <div class="info-row">
                <b>AI Confidence:</b>
                <span id="aiConfidence">-</span>
            </div>

            <div class="info-row">
                <b>Request Created:</b>
                <span id="requestTime">-</span>
            </div>

            <div class="status">
                Collection Status:
                <span id="status">Pending</span>
            </div>

        </div>

    </div>


    <!-- REFRESH -->

    <div class="card">

        <button
            class="refresh-button"
            onclick="loadDashboard()">
            🔄 Refresh Dashboard
        </button>

    </div>


    <!-- LOGOUT -->

    <div class="card">

        <button
            class="logout-button"
            onclick="logout()">
            🚪 Logout
        </button>

    </div>

</div>


<script>

    // =========================
    // LOAD DASHBOARD
    // =========================

    function loadDashboard() {

        let activeRequest =
            localStorage.getItem("activeRequest");


        let status =
            localStorage.getItem("collectionStatus")
            || "Pending";


        // =========================
        // NO ACTIVE REQUEST
        // =========================

        if (activeRequest !== "true") {

            document.getElementById(
                "noRequest"
            ).style.display = "block";

            document.getElementById(
                "requestDetails"
            ).style.display = "none";

            document.getElementById(
                "totalRequests"
            ).innerText = "0";

            document.getElementById(
                "pendingRequests"
            ).innerText = "0";

            document.getElementById(
                "completedRequests"
            ).innerText = "0";

            return;
        }


        // =========================
        // SHOW REQUEST
        // =========================

        document.getElementById(
            "noRequest"
        ).style.display = "none";

        document.getElementById(
            "requestDetails"
        ).style.display = "block";


        // =========================
        // REQUEST DETAILS
        // =========================

        document.getElementById(
            "requestId"
        ).innerText =
            localStorage.getItem("requestId") || "-";


        document.getElementById(
            "hospital"
        ).innerText =
            localStorage.getItem("hospital") || "-";


        document.getElementById(
            "waste"
        ).innerText =
            localStorage.getItem("waste") || "-";


        document.getElementById(
            "quantity"
        ).innerText =
            localStorage.getItem("quantity") || "-";


        document.getElementById(
            "location"
        ).innerText =
            localStorage.getItem("location") || "-";


        document.getElementById(
            "aiCategory"
        ).innerText =
            localStorage.getItem("requestAICategory")
            || localStorage.getItem("aiWasteCategory")
            || "-";


        document.getElementById(
            "aiConfidence"
        ).innerText =
            localStorage.getItem("requestAIConfidence")
            || localStorage.getItem("aiConfidence")
            || "-";


        document.getElementById(
            "requestTime"
        ).innerText =
            localStorage.getItem("requestTime") || "-";


        document.getElementById(
            "status"
        ).innerText = status;


        // =========================
        // STATISTICS
        // =========================

        document.getElementById(
            "totalRequests"
        ).innerText = "1";


        if (status === "Completed") {

            document.getElementById(
                "pendingRequests"
            ).innerText = "0";

            document.getElementById(
                "completedRequests"
            ).innerText = "1";

        }

        else {

            document.getElementById(
                "pendingRequests"
            ).innerText = "1";

            document.getElementById(
                "completedRequests"
            ).innerText = "0";
        }

    }


    // =========================
    // LOGOUT
    // =========================

    function logout() {

        localStorage.removeItem("loggedIn");

        localStorage.removeItem("userRole");

        window.location.href =
            "login.html";
    }


    // =========================
    // AUTO UPDATE
    // =========================

    setInterval(function() {

        loadDashboard();

    }, 1000);


    // FIRST LOAD

    loadDashboard();

</script>

</body>
</html>
