<!DOCTYPE html>
<html>
<head>
    <title>Hospital Staff - Medical Waste Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e1f5ef, #ffffff);
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            text-align: center;
        }

        .header h1 {
            color: #176b5b;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            margin-top: 25px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            color: #176b5b;
            border-bottom: 2px solid #176b5b;
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #176b5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0d4d42;
        }

        .logout {
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #777;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .info {
            background-color: #eef9f5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            color: #176b5b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div style="font-size:50px;">🏥</div>

        <h1>HOSPITAL STAFF PORTAL</h1>

        <p>Smart Medical Waste Collection Management</p>

        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="card">

        <h2>♻️ Create Collection Request</h2>

        <label>Hospital Name</label>
        <input type="text" id="hospitalName"
               placeholder="Enter hospital name">

        <label>Medical Waste Type</label>

        <select id="wasteType">
            <option value="Biomedical Waste">Biomedical Waste</option>
            <option value="Sharps">Sharps</option>
            <option value="Infectious Waste">Infectious Waste</option>
            <option value="Pharmaceutical Waste">Pharmaceutical Waste</option>
            <option value="General Medical Waste">General Medical Waste</option>
        </select>

        <label>Quantity (kg)</label>
        <input type="number" id="quantity"
               placeholder="Enter quantity">

        <label>Ward / Collection Location</label>
        <input type="text" id="location"
               placeholder="Enter ward or location">

        <button class="submit-btn" onclick="submitRequest()">
            Submit Collection Request
        </button>

        <div class="info">
            🔔 Your request will be sent to the authorized waste collector.
        </div>

    </div>

</div>

<script>

function logout() {
    window.location.href = "login.html";
}

function submitRequest() {

    let hospital = document.getElementById("hospitalName").value;
    let waste = document.getElementById("wasteType").value;
    let quantity = document.getElementById("quantity").value;
    let location = document.getElementById("location").value;

    if (hospital == "" || quantity == "" || location == "") {
        alert("Please fill all details!");
        return;
    }

    localStorage.setItem("hospital", hospital);
    localStorage.setItem("waste", waste);
    localStorage.setItem("quantity", quantity);
    localStorage.setItem("location", location);

    alert("Waste Collection Request Submitted Successfully!");
}

</script>

</body>
</html>
